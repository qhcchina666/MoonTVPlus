name:Build and Push Docker Image
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # 关键修复权限配置
    permissions:
      contents: read
      packages: write
      attestations: write
    strategy:
      matrix:
        arch: [amd64,arm64]
    steps:
      - name:拉取源码
        uses: actions/checkout@v4

      - name:开启Buildx
        uses: docker/setup-buildx-action@v3

      - name:登录GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name:构建并且推送镜像
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/mtvpls/moontvplus-lite:latest
